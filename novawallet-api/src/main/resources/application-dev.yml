spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/novawallet
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:8407}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration


logging:
  level:
    org.hibernate.SQL: DEBUG

# ── DEV-ONLY CREDENTIAL DEFAULTS ─────────────────────────────────────────────
# These fallbacks exist ONLY so the app boots locally without env vars.
# They are throwaway development values — NEVER use them in any shared or
# production environment. Production requires real secrets via environment
# variables (see application-prod.yml, which has no fallbacks).
jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktdGhhdC1pcy1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1Ng==}

app:
  admin:
    password: ${APP_ADMIN_PASSWORD:Admin@123}