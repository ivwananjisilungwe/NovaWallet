spring:

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration

# Test-only secrets. These override the fail-fast production/development
# placeholders (${JWT_SECRET}, ${APP_ADMIN_PASSWORD}) so the Spring context
# can load during automated tests without real environment variables.
# They are NOT valid for any non-test environment.
jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LWZvci1ub3Zhd2FsbGV0LWF1dG9tYXRlZC10ZXN0cy1ub3QtZm9yLXByb2R1Y3Rpb24=

app:
  admin:
    password: test-only-admin-password-not-for-production
  kyc:
    upload-dir: target/test-uploads/kyc
