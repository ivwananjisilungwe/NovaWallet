 fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Customer money is held by our licensed partner,</text><text x="20.00" y="296.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">[Partner name].</text><text x="20.00" y="340.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">2. Your account</text><text x="20.00" y="366.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">You must give true details and keep your PIN</text><text x="20.00" y="388.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">secret. We will never ask for your PIN or your</text><text x="20.00" y="410.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">mobile money PIN.</text><text x="20.00" y="454.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">3. Fees and limits</text><text x="20.00" y="480.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">We show every fee before you confirm. Limits</text><text x="20.00" y="502.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">depend on your account level.</text><text x="20.00" y="546.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">4. When things go wrong</text><text x="20.00" y="572.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Report a problem in the app. We reply within 24</text><text x="20.00" y="594.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">hours and keep you updated until it’s fixed.</text><rect x="0.00" y="716.00" width="390.00" height="128.00" rx="0" fill="#060A18"/><line x1="0.00" y1="716.00" x2="390.00" y2="716.00" stroke="#1F2A52" stroke-width="1" stroke-linecap="round"/><g filter="url(#sh2)"><rect x="20.00" y="746.00" width="350.00" height="56.00" rx="28.0" fill="#7896FF"/></g><text x="168.70" y="779.76" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#050A1C" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">I agree</text><text x="30.00" y="31.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">9:41</text><rect x="316.00" y="20.00" width="22.00" height="11.50" rx="3.5" fill="none"/><rect x="316.60" y="20.60" width="20.80" height="10.30" rx