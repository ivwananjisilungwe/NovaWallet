 y2="0"><stop offset="0" stop-color="#7896FF"/><stop offset="1" stop-color="#6CCBFF"/></linearGradient></defs><rect x="0.00" y="0.00" width="1500.00" height="836.00" rx="0" fill="#060A18"/><rect x="40.00" y="34.00" width="36.00" height="5.00" rx="2.5" fill="url(#hd)"/><text x="40.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7896FF" text-anchor="start" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">NOVAWALLET · SYSTEM DESIGN · D18</text><text x="40.00" y="96.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Sequence: payout in three stages</text><text x="1460.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8592BA" text-anchor="end" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">DARK</text><text x="40.00" y="124.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#AEB8D8" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">The provider call happens with no database transaction open, so slow networks never hold locks on wallets.</text><rect x="362.5" y="242" width="457.5" height="92" rx="10" fill="#1A2659" fill-opacity=".35" stroke="#7896FF" stroke-width="1.2"/><rect x="362.50" y="242.00" width="119.53" height="20.00" rx="8" fill="#7896FF"/><text x="422.26" y="256.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#050A1C" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE A · SHORT TX</text><rect x="362.5" y="340" width="775.0" height="94" rx="10" fill="#33250B" fill-opacity=".35" stroke="#F6B64A" stroke-width="1.2"/><rect x="362.50" y=