 y2="0"><stop offset="0" stop-color="#2F5BF5"/><stop offset="1" stop-color="#38B2F5"/></linearGradient></defs><rect x="0.00" y="0.00" width="1500.00" height="836.00" rx="0" fill="#F3F5FB"/><rect x="40.00" y="34.00" width="36.00" height="5.00" rx="2.5" fill="url(#hd)"/><text x="40.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2F5BF5" text-anchor="start" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">NOVAWALLET · SYSTEM DESIGN · D18</text><text x="40.00" y="96.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Sequence: payout in three stages</text><text x="1460.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5F6A88" text-anchor="end" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">LIGHT</text><text x="40.00" y="124.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5573" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">The provider call happens with no database transaction open, so slow networks never hold locks on wallets.</text><rect x="362.5" y="242" width="457.5" height="92" rx="10" fill="#E6ECFF" fill-opacity=".35" stroke="#2F5BF5" stroke-width="1.2"/><rect x="362.50" y="242.00" width="119.53" height="20.00" rx="8" fill="#2F5BF5"/><text x="422.26" y="256.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE A · SHORT TX</text><rect x="362.5" y="340" width="775.0" height="94" rx="10" fill="#FFF0D6" fill-opacity=".35" stroke="#8F5300" stroke-width="1.2"/><rect x="362.50" y="340.00" width="132.09" height="20.00" rx="8" fill="#8F5300"/><text x="428.55" y="354.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE B · NO TX OPEN</text><rect x="362.5" y="446" width="457.5" height="128" rx="10" fill="#DEF5EC" fill-opacity=".35" stroke="#0B7A55" stroke-width="1.2"/><rect x="362.50" y="446.00" width="115.56" height="20.00" rx="8" fill="#0B7A55"/><text x="420.28" y="460.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE C · FINALISE</text><line x1="115.00" y1="198.00" x2="115.00" y2="772.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="432.50" y1="198.00" x2="432.50" y2="772.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="750.00" y1="198.00" x2="750.00" y2="772.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="1067.50" y1="198.00" x2="1067.50" y2="772.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="1385.00" y1="198.00" x2="1385.00" y2="772.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="115.0" y1="232" x2="432.5" y2="232" stroke="#4A5573" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar-default)"/><line x1="432.5" y1="282" x2="750.0" y2="282" stroke="#2F5BF5" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar-primary)"/><line x1="432.5" y1="316" x2="750.0" y2="316" stroke="#4A5573" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar-default)"/><line x1="432.5" y1="380" x2="1067.5" y2="380" stroke="#8F5300" stroke-width="1.5" stroke-linecap="round" marker-