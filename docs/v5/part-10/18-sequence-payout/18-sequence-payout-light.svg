ily="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B7A55" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Payout service</text><rect x="685.0" y="156.5" width="130" height="44" rx="14" fill="#0A1230" fill-opacity="0.07"/><rect x="685.0" y="154" width="130" height="44" rx="14" fill="#E3EEFB" stroke="#1F5FA8" stroke-width="1.4"/><text x="750.00" y="178.75" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F5FA8" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">PostgreSQL</text><rect x="1002.5" y="156.5" width="130" height="44" rx="14" fill="#0A1230" fill-opacity="0.07"/><rect x="1002.5" y="154" width="130" height="44" rx="14" fill="#E3EEFB" stroke="#1F5FA8" stroke-width="1.4"/><text x="1067.50" y="178.75" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F5FA8" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Lipila</text><rect x="1320.0" y="156.5" width="130" height="44" rx="14" fill="#0A1230" fill-opacity="0.07"/><rect x="1320.0" y="154" width="130" height="44" rx="14" fill="#FFF0D6" stroke="#8F5300" stroke-width="1.4"/><text x="1385.00" y="178.75" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8F5300" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Reconciliation job</text><text x="273.75" y="225.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">POST /payouts (amount, accountNumber, PIN, Idempotency-Key)</text><text x="591.25" y="275.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE A: BEGIN, lock wallet, check funds, create HOLD</text><text x="591.25" y="309.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">INSERT payout PENDING; COMMIT</text><text x="750.00" y="373.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE B: POST /disbursements/mobile-money</text><text x="750.00" y="407.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">SUCCESS, FAILED or timeout</text><text x="591.25" y="479.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE C (SUCCESS): capture HOLD, post ledger, COMPLETED</text><text x="591.25" y="513.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">STAGE C (FAILED): release HOLD, mark FAILED</text><text x="591.25" y="547.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">TIMEOUT: mark PENDING_RECONCILIATION, keep HOLD</text><text x="273.75" y="581.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Status + receipt (or “checking”)</text><text x="1067.50" y="623.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Every few minutes: SELECT PENDING_RECONCILIATION</text><text x="1226.25" y="657.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">GET /transactions/{ref}</text><text x="1226.25" y="691.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">final status</text><text x="1067.50" y="725.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Finalise like stage C; alert admin after 24 h</text><line x1="40.00" y1="796.00" x2="1460.00" y2="796.00" stroke="#E3E8F3" stroke-width="1" stroke-linecap="round"/><text x="40.00" y="812.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5F6A88" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Part 10 · System diagrams · Mulungushi University, Zambia</text><text x="1460.00" y="812.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#5F6A88" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">NovaWallet v5</text></svg>