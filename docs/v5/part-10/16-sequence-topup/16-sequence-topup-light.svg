l="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Student enters mobile money PIN</text><text x="908.75" y="567.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">POST /webhooks/lipila (status callback)</text><text x="792.00" y="616.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Store event id once (dedupe), return</text><text x="792.00" y="629.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">200</text><text x="908.75" y="654.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">GET /transactions/{referenceId} (re-query)</text><text x="908.75" y="688.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">status, amount, currency</text><text x="792.00" y="737.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Compare with our record: amount</text><text x="792.00" y="750.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">and currency</text><text x="591.25" y="775.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">creditWallet(referenceId) when SUCCESS</text><text x="474.50" y="824.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">One transaction: post ledger entry,</text><text x="474.50" y="837.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">mark SUCCEEDED</text><text x="273.75" y="862.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Push notification + new balance</text><line x1="40.00" y1="979.00" x2="1460.00" y2="979.00" stroke="#E3E8F3" stroke-width="1" stroke-linecap="round"/><text x="40.00" y="995.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5F6A88" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Part 10 · System diagrams · Mulungushi University, Zambia</text><text x="1460.00" y="995.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#5F6A88" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">NovaWallet v5</text></svg>