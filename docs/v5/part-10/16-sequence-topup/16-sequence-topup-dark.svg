" y="775.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">creditWallet(referenceId) when SUCCESS</text><text x="474.50" y="824.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">One transaction: post ledger entry,</text><text x="474.50" y="837.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">mark SUCCEEDED</text><text x="273.75" y="862.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Push notification + new balance</text><line x1="40.00" y1="979.00" x2="1460.00" y2="979.00" stroke="#1F2A52" stroke-width="1" stroke-linecap="round"/><text x="40.00" y="995.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#8592BA" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Part 10 · System diagrams · Mulungushi University, Zambia</text><text x="1460.00" y="995.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#8592BA" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">NovaWallet v5</text></svg>