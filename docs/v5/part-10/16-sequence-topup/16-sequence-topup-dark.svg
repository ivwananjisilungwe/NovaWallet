00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Check PIN, limits, wallet ACTIVE</text><text x="591.25" y="299.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">createCollection(walletId, amount)</text><text x="792.00" y="348.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Insert collection_request PENDING</text><text x="908.75" y="373.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">POST /collections/mobile-money (callbackUrl header)</text><text x="908.75" y="407.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">202 referenceId</text><text x="273.75" y="441.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">202 PENDING + referenceId (app starts polling)</text><text x="1226.25" y="475.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">USSD prompt: approve payment?</text><text x="1226.25" y="509.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill