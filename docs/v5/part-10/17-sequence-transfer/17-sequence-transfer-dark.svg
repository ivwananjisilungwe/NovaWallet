otency key” step.</text><text x="496.00" y="790.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#F5C062" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">No second debit.</text><text x="242.00" y="225.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">POST /transactions/transfer + Idempotency-Key</text><text x="411.00" y="274.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Verify JWT, user ACTIVE, rate limit</text><text x="623.00" y="299.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Lookup idempotency key</text><text x="623.00" y="333.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">not found</text><text x="496.00" y="367.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">transfer(receiverWalletId, amount, pin)</text><text x="665.00" y="416.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Validate PIN hash, attempts, limits</text><text x="750.00" y="457.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">BEGIN; SELECT wallets FOR UPDATE (lowest id first)</text><text x="750.00" y="491.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">INSERT journal_entry + 2 postings, UPDATE balances</text><text x="750.00" y="525.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">INSERT outbox(TransferCompleted); store idempotency result</text><text x="750.00" y="559.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">COMMIT</text><text x="369.00" y="593.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">200 TransactionResponse (via filter)</text><text x="1004.00" y="627.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Poll unsent outbox rows (SKIP LOCKED)</text><text x="1258.00" y="661.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Publish TransferCompleted</text><text x="1343.00" y="710.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="end" letter-spacing="0" fill-opacity="1" style