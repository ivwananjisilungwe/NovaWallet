 y2="0"><stop offset="0" stop-color="#2F5BF5"/><stop offset="1" stop-color="#38B2F5"/></linearGradient></defs><rect x="0.00" y="0.00" width="1500.00" height="763.00" rx="0" fill="#F3F5FB"/><rect x="40.00" y="34.00" width="36.00" height="5.00" rx="2.5" fill="url(#hd)"/><text x="40.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2F5BF5" text-anchor="start" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">NOVAWALLET · SYSTEM DESIGN · D20</text><text x="40.00" y="96.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0A1230" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Sequence: transactional outbox and event delivery</text><text x="1460.00" y="62.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5F6A88" text-anchor="end" letter-spacing="1.6" fill-opacity="1" style="font-feature-settings:'tnum'">LIGHT</text><text x="40.00" y="124.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4A5573" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Phase 5 pattern. A business change and its event commit together, so no event is lost and none is sent for a rolled-back change.</text><rect x="45.0" y="208" width="457.5" height="126" rx="10" fill="#DEF5EC" fill-opacity=".35" stroke="#0B7A55" stroke-width="1.2"/><rect x="45.00" y="208.00" width="59.98" height="20.00" rx="8" fill="#0B7A55"/><text x="74.99" y="222.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">ATOMIC</text><line x1="115.00" y1="198.00" x2="115.00" y2="699.00" stroke="#C5CEE2" stroke-width="1.2" stroke-linecap="round" stroke-das