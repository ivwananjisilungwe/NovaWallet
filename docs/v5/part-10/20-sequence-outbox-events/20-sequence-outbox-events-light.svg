#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">SELECT unsent FOR UPDATE SKIP LOCKED</text><text x="908.75" y="383.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Publish event (confirm mode)</text><text x="908.75" y="417.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">ack</text><text x="591.25" y="451.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">UPDATE outbox SET sent_at</text><text x="1226.25" y="491.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Deliver event_id=…</text><text x="908.75" y="525.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">INSERT processed_events(event_id) ON CONFLICT DO NOTHING</text><text x="1343.00" y="574.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Skip if already processed, else create</text><text x="1343.00" y="587.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">notification + push</text><text x="1226.25" y="612.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0A1230" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">ack (or retry, then dead-letter queue)</text><line x1="40.00" y1="723.00" x2="1460.00" y2="723.00" stroke="#E3E8F3" stroke-width="1" stroke-linecap="round"/><text x="40.00" y="739.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#5F6A88" text-anchor="start" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Part 10 · System diagrams · Mulungushi University, Zambia</text><text x="1460.00" y="739.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#5F6A88" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">NovaWallet v5</text></svg>