F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">SELECT unsent FOR UPDATE SKIP LOCKED</text><text x="908.75" y="383.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Publish event (confirm mode)</text><text x="908.75" y="417.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">ack</text><text x="591.25" y="451.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">UPDATE outbox SET sent_at</text><text x="1226.25" y="491.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Deliver event_id=…</text><text x="908.75" y="525.50" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="middle" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">INSERT processed_events(event_id) ON CONFLICT DO NOTHING</text><text x="1343.00" y="574.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">Skip if already processed, else create</text><text x="1343.00" y="587.00" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#F2F5FF" text-anchor="end" letter-spacing="0" fill-opacity="1" style="font-feature-settings:'tnum'">notification + push</text><text x="122